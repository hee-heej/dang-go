<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
<meta name="theme-color" content="#F5F1EB">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Dang-go">
<title>Dang-go</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍡</text></svg>">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍡</text></svg>">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
  :root {
    --bg: #F5F1EB; --surface: #FFFCF7; --surface-2: #EFEBE3;
    --text: #3A3531; --text-2: #6B655F; --text-3: #9C968E;
    --border: rgba(0,0,0,0.05); --border-2: rgba(0,0,0,0.10);
    --accent: #C97B8E; --shadow: 0 2px 6px rgba(0,0,0,0.04);
    --radius: 16px; --radius-sm: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1F1D1B; --surface: #2A2826; --surface-2: #353230;
      --text: #E8E2D8; --text-2: #B0A99F; --text-3: #847E76;
      --border: rgba(255,255,255,0.06); --border-2: rgba(255,255,255,0.12);
      --accent: #E2A2B2; --shadow: 0 2px 8px rgba(0,0,0,0.25);
    }
  }
  html, body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Pretendard", "Apple SD Gothic Neo", sans-serif;
    font-size: 15px; line-height: 1.5;
    -webkit-font-smoothing: antialiased; overscroll-behavior-y: none;
  }
  body {
    max-width: 480px; margin: 0 auto;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    min-height: 100vh;
  }
  .app { padding: 16px 16px 24px; }
  .header {
    display: flex; align-items: center; justify-content: center;
    gap: 8px; padding: 8px 4px 16px;
  }
  .header-emoji { font-size: 24px; }
  .header h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; color: var(--text); }
  .mode-toggle {
    display: flex; gap: 4px;
    background: var(--surface-2); padding: 4px;
    border-radius: 999px; margin-bottom: 16px;
  }
  .mode-btn {
    flex: 1; background: transparent; border: none;
    padding: 8px 6px; font-size: 12px; font-weight: 500;
    color: var(--text-2); cursor: pointer; border-radius: 999px;
    font-family: inherit; transition: all 0.15s;
  }
  .mode-btn.active {
    background: var(--surface); color: var(--text);
    box-shadow: 0 1px 2px rgba(0,0,0,0.06); font-weight: 600;
  }
  .tab-content { display: none; }
  .tab-content.active { display: block; }
  .flash-page { display: flex; flex-direction: column; }
  .quiz-progress {
    font-size: 12px; color: var(--text-3); text-align: center;
    margin-bottom: 12px; font-weight: 500; letter-spacing: 0.5px;
  }
  .flashcard {
    background: #E8E2F0; border-radius: 24px;
    padding: 22px 22px 24px; cursor: pointer;
    user-select: none; -webkit-user-select: none;
    box-shadow: var(--shadow); overflow: hidden;
    transition: transform 0.1s, opacity 0.15s;
    margin-bottom: 16px; position: relative;
    display: flex; flex-direction: column; min-height: 440px;
  }
  .flashcard:active { transform: scale(0.99); }
  .flash-top {
    display: flex; justify-content: center; align-items: center;
    margin-bottom: 16px;
  }
  .flash-category {
    font-size: 13px; font-weight: 500;
    color: rgba(58,53,49,0.7);
    background: rgba(255,255,255,0.45);
    padding: 4px 12px; border-radius: 999px;
  }
  .flash-body {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center; padding: 8px 0;
  }
  .flash-example-area { width: 100%; margin-bottom: 20px; }
  .flash-example-ko {
    font-size: 24px; font-weight: 600;
    color: rgba(58,53,49,0.95); line-height: 1.4;
    letter-spacing: -0.5px; margin-bottom: 12px;
  }
  .flash-example-cn {
    font-size: 22px; font-weight: 600;
    color: rgba(58,53,49,0.92); line-height: 1.4;
    letter-spacing: -0.5px; margin-bottom: 8px;
    display: none;
  }
  .flashcard.flipped .flash-example-cn { display: block; }
  .flash-example-pinyin {
    font-size: 13px; color: rgba(58,53,49,0.55);
    font-style: italic; display: none;
  }
  .flashcard.flipped .flash-example-pinyin { display: block; }
  .flash-front-meaning {
    display: inline-block; background: rgba(58,53,49,0.10);
    color: rgba(58,53,49,0.78); padding: 7px 16px;
    border-radius: 999px; font-size: 13px; font-weight: 500;
  }
  .flashcard.flipped .flash-front-meaning { display: none; }
  .flash-back-info {
    display: none; width: 100%; padding-top: 18px;
    border-top: 1px solid rgba(58,53,49,0.12);
  }
  .flashcard.flipped .flash-back-info { display: block; }
  .flash-back-chinese {
    font-size: 22px; font-weight: 600;
    color: rgba(58,53,49,0.95); line-height: 1.2;
    letter-spacing: -0.3px; margin-bottom: 6px;
  }
  .flash-back-meaning { font-size: 13px; color: rgba(58,53,49,0.75); margin-bottom: 4px; }
  .flash-back-pinyin { font-size: 13px; color: rgba(58,53,49,0.55); font-style: italic; }
  .flash-note {
    font-size: 12px; color: rgba(58,53,49,0.55);
    font-style: italic; padding: 8px 8px 0; margin-top: 4px;
  }
  .flash-hint { margin-top: 16px; text-align: center; font-size: 12px; color: rgba(58,53,49,0.42); }
  .quiz-controls { display: flex; gap: 8px; align-items: center; }
  .quiz-btn {
    flex: 1; background: var(--surface); border: 1px solid var(--border);
    padding: 14px 10px; border-radius: var(--radius-sm);
    font-size: 14px; font-weight: 500; cursor: pointer;
    color: var(--text); font-family: inherit; transition: all 0.1s;
  }
  .quiz-btn:active { background: var(--surface-2); transform: scale(0.97); }
  .quiz-btn.primary { background: var(--text); color: var(--surface); border-color: var(--text); }
  .fav-center-btn {
    width: 50px; height: 50px; flex-shrink: 0;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 50%; cursor: pointer;
    color: var(--text-3); font-size: 22px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    font-family: inherit; transition: all 0.15s;
  }
  .fav-center-btn:active { transform: scale(0.9); }
  .fav-center-btn.active { background: #FCE6EC; color: var(--accent); border-color: #F5C8D2; }
  @media (prefers-color-scheme: dark) {
    .fav-center-btn.active { background: #4A2530; color: var(--accent); border-color: #6B3645; }
  }
  .search-input {
    width: 100%; padding: 12px 14px;
    border: 1px solid var(--border); border-radius: var(--radius-sm);
    background: var(--surface); color: var(--text);
    font-size: 14px; font-family: inherit;
    margin-bottom: 12px; -webkit-appearance: none; text-align: center;
  }
  .search-input:focus { outline: none; border-color: var(--border-2); }
  .filter-row {
    display: flex; gap: 6px; overflow-x: auto;
    padding-bottom: 4px; margin-bottom: 12px; scrollbar-width: none;
  }
  .filter-row::-webkit-scrollbar { display: none; }
  .filter-chip {
    background: var(--surface); border: 1px solid var(--border);
    padding: 6px 12px; border-radius: 999px;
    font-size: 12px; cursor: pointer; color: var(--text-2);
    white-space: nowrap; font-family: inherit;
    flex-shrink: 0; font-weight: 500;
  }
  .filter-chip.active { background: var(--text); color: var(--surface); border-color: var(--text); }
  .stats-row {
    font-size: 11px; color: var(--text-3);
    margin-bottom: 12px; text-align: center;
    font-weight: 500; letter-spacing: 0.3px;
  }
  .vocab-list { display: flex; flex-direction: column; gap: 10px; }
  .vocab-card {
    background: var(--surface); border-radius: var(--radius);
    padding: 16px 14px 14px; position: relative;
    box-shadow: var(--shadow); border: 1px solid var(--border);
    text-align: center;
  }
  .vocab-card-top {
    display: flex; justify-content: space-between;
    align-items: flex-start; margin-bottom: 10px; gap: 10px;
  }
  .vocab-category {
    display: inline-block; font-size: 10px;
    padding: 3px 8px; border-radius: 999px;
    background: var(--surface-2); color: var(--text-2);
    font-weight: 500; letter-spacing: 0.3px;
  }
  .fav-btn {
    background: transparent; border: none; cursor: pointer;
    padding: 0; color: var(--text-3);
    font-size: 22px; line-height: 1; flex-shrink: 0;
  }
  .fav-btn.active { color: var(--accent); }
  .fav-btn:active { transform: scale(0.85); }
  .vocab-meaning {
    font-size: 17px; font-weight: 600; color: var(--text);
    margin-bottom: 8px; line-height: 1.3; letter-spacing: -0.3px;
  }
  .vocab-chinese-row {
    display: flex; align-items: baseline; gap: 8px;
    flex-wrap: wrap; margin-bottom: 3px; justify-content: center;
  }
  .vocab-chinese { font-size: 18px; font-weight: 500; color: var(--text); }
  .vocab-pinyin { font-size: 13px; color: var(--text-2); font-style: italic; }
  .vocab-tone { font-size: 10px; color: var(--text-3); margin-bottom: 10px; letter-spacing: 0.3px; }
  .vocab-example { background: var(--surface-2); padding: 10px 12px; border-radius: var(--radius-sm); font-size: 13px; }
  .vocab-example-ko { color: var(--text); margin-bottom: 3px; font-weight: 500; }
  .vocab-example-cn { color: var(--text-2); font-size: 12px; }
  .vocab-note { font-size: 11px; color: var(--text-3); margin-top: 8px; font-style: italic; }
  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-3); font-size: 13px; }
  .empty-state-emoji { font-size: 36px; margin-bottom: 8px; opacity: 0.6; }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <span class="header-emoji">🍡</span>
    <h1>Dang-go</h1>
  </div>

  <!-- 플래시카드가 첫 번째 (active) -->
  <div class="mode-toggle">
    <button class="mode-btn active" data-mode="all">전체</button>
    <button class="mode-btn" data-mode="fav">즐겨찾기</button>
    <button class="mode-btn" data-mode="list">리스트 보기</button>
  </div>

  <div class="tab-content active" id="tab-all">
    <div class="flash-page">
      <div class="quiz-progress" id="quiz-progress-all">1 / 0</div>
      <div class="flashcard" id="flashcard-all" onclick="handleCardClick(event, 'all')">
        <div class="flash-top"><span class="flash-category" id="card-category-all"></span></div>
        <div class="flash-body">
          <div class="flash-example-area">
            <div class="flash-example-ko" id="card-ex-ko-all"></div>
            <div class="flash-example-cn" id="card-ex-cn-all"></div>
            <div class="flash-example-pinyin" id="card-ex-pinyin-all"></div>
          </div>
          <div class="flash-front-meaning" id="card-meaning-front-all"></div>
          <div class="flash-back-info">
            <div class="flash-back-chinese" id="card-chinese-all"></div>
            <div class="flash-back-meaning" id="card-meaning-back-all"></div>
            <div class="flash-back-pinyin" id="card-pinyin-all"></div>
            <div class="flash-note" id="card-note-all"></div>
          </div>
          <div class="flash-hint" id="card-hint-all">탭해서 정답 보기</div>
        </div>
      </div>
      <div class="quiz-controls">
        <button class="quiz-btn" onclick="prevCard('all')">← 이전</button>
        <button class="fav-center-btn" id="card-fav-all" onclick="toggleCardFav(event, 'all')" aria-label="즐겨찾기">♡</button>
        <button class="quiz-btn primary" onclick="nextCard('all')">다음 →</button>
      </div>
    </div>
  </div>

  <div class="tab-content" id="tab-fav">
    <div class="flash-page">
      <div class="quiz-progress" id="quiz-progress-fav">0 / 0</div>
      <div class="flashcard" id="flashcard-fav" onclick="handleCardClick(event, 'fav')">
        <div class="flash-top"><span class="flash-category" id="card-category-fav"></span></div>
        <div class="flash-body">
          <div class="flash-example-area">
            <div class="flash-example-ko" id="card-ex-ko-fav"></div>
            <div class="flash-example-cn" id="card-ex-cn-fav"></div>
            <div class="flash-example-pinyin" id="card-ex-pinyin-fav"></div>
          </div>
          <div class="flash-front-meaning" id="card-meaning-front-fav"></div>
          <div class="flash-back-info">
            <div class="flash-back-chinese" id="card-chinese-fav"></div>
            <div class="flash-back-meaning" id="card-meaning-back-fav"></div>
            <div class="flash-back-pinyin" id="card-pinyin-fav"></div>
            <div class="flash-note" id="card-note-fav"></div>
          </div>
          <div class="flash-hint" id="card-hint-fav">탭해서 정답 보기</div>
        </div>
      </div>
      <div class="quiz-controls">
        <button class="quiz-btn" onclick="prevCard('fav')">← 이전</button>
        <button class="fav-center-btn" id="card-fav-fav" onclick="toggleCardFav(event, 'fav')" aria-label="즐겨찾기">♡</button>
        <button class="quiz-btn primary" onclick="nextCard('fav')">다음 →</button>
      </div>
    </div>
  </div>

  <div class="tab-content" id="tab-list">
    <input type="text" id="search-input" class="search-input" placeholder="🔍 한국어 / 중국어 / 병음 검색" />
    <div class="filter-row" id="filter-chips"></div>
    <div class="stats-row" id="stats-row"></div>
    <div class="vocab-list" id="vocab-list"></div>
  </div>
</div>

<script>
const VOCAB = [
  {cat:"제품/디자인", cn:"设计", py:"shè jì", tone:"4성+4성", mean:"디자인", ex_cn:"新的产品设计已经完成了。", ex_py:"xīn de chǎn pǐn shè jì yǐ jīng wán chéng le", ex_ko:"새 제품 디자인이 완료됐어요.", note:"", color:"#E8E2F0"},
  {cat:"제품/디자인", cn:"设计稿", py:"shè jì gǎo", tone:"4성+4성+3성", mean:"디자인 시안", ex_cn:"设计稿可以马上发给你。", ex_py:"shè jì gǎo kě yǐ mǎ shàng fā gěi nǐ", ex_ko:"디자인 시안 바로 보내드릴게요.", note:"稿=원고/시안", color:"#E8E2F0"},
  {cat:"제품/디자인", cn:"款式", py:"kuǎn shì", tone:"3성+4성", mean:"종류, 스타일, 모델", ex_cn:"目前有两种款式。", ex_py:"mù qián yǒu liǎng zhǒng kuǎn shì", ex_ko:"현재 두 가지 종류가 있어요.", note:"", color:"#E8E2F0"},
  {cat:"제품/디자인", cn:"这款", py:"zhè kuǎn", tone:"4성+3성", mean:"이 (제품/모델)", ex_cn:"我们这款产品要增加尺寸。", ex_py:"wǒ men zhè kuǎn chǎn pǐn yào zēng jiā chǐ cùn", ex_ko:"이 제품 사이즈를 늘릴 거예요.", note:"제품 가리킬 때", color:"#E8E2F0"},
  {cat:"제품/디자인", cn:"种类", py:"zhǒng lèi", tone:"3성+4성", mean:"종류 (큰 개념)", ex_cn:"我想再增加产品种类。", ex_py:"wǒ xiǎng zài zēng jiā chǎn pǐn zhǒng lèi", ex_ko:"제품 종류를 더 늘리고 싶어요.", note:"", color:"#E8E2F0"},
  {cat:"제품/디자인", cn:"潘通色", py:"pān tōng sè", tone:"1성+1성+4성", mean:"팬톤 컬러", ex_cn:"里面有包含潘通色。", ex_py:"lǐ miàn yǒu bāo hán pān tōng sè", ex_ko:"팬톤 컬러가 포함되어 있어요.", note:"", color:"#E8E2F0"},
  {cat:"제품/디자인", cn:"渐变色", py:"jiàn biàn sè", tone:"4성+4성+4성", mean:"그라데이션 색상", ex_cn:"小的产品有渐变色。", ex_py:"xiǎo de chǎn pǐn yǒu jiàn biàn sè", ex_ko:"작은 제품은 그라데이션이 있어요.", note:"", color:"#E8E2F0"},
  {cat:"제품/디자인", cn:"尺寸", py:"chǐ cùn", tone:"3성+4성", mean:"사이즈, 치수", ex_cn:"小尺寸的产品。", ex_py:"xiǎo chǐ cùn de chǎn pǐn", ex_ko:"작은 사이즈 제품.", note:"", color:"#E8E2F0"},
  {cat:"제품/디자인", cn:"规格", py:"guī gé", tone:"1성+2성", mean:"규격, 스펙", ex_cn:"其他款式的规格在设计中。", ex_py:"qí tā kuǎn shì de guī gé zài shè jì zhōng", ex_ko:"다른 디자인의 규격은 디자인 중이에요.", note:"제품 사양", color:"#E8E2F0"},
  {cat:"제품/디자인", cn:"方形", py:"fāng xíng", tone:"1성+2성", mean:"사각형", ex_cn:"方形裁切得整齐一点。", ex_py:"fāng xíng cái qiē de zhěng qí yì diǎn", ex_ko:"사각형은 깔끔하게 재단해 주세요.", note:"", color:"#E8E2F0"},
  {cat:"생산/제작", cn:"样品", py:"yàng pǐn", tone:"4성+3성", mean:"샘플 (완성된 물건)", ex_cn:"我想顺便拿样品。", ex_py:"wǒ xiǎng shùn biàn ná yàng pǐn", ex_ko:"샘플도 같이 받고 싶어요.", note:"물건 자체", color:"#F5E8D5"},
  {cat:"생산/제작", cn:"打样", py:"dǎ yàng", tone:"3성+4성", mean:"샘플 제작 (행위)", ex_cn:"我看下打样费多少。", ex_py:"wǒ kàn xià dǎ yàng fèi duō shǎo", ex_ko:"샘플 제작비 얼마인지 볼게요.", note:"만드는 행위", color:"#F5E8D5"},
  {cat:"생산/제작", cn:"打样费", py:"dǎ yàng fèi", tone:"3성+4성+4성", mean:"샘플 제작비", ex_cn:"打样费挺贵的。", ex_py:"dǎ yàng fèi tǐng guì de", ex_ko:"샘플 제작비가 꽤 비싸네요.", note:"", color:"#F5E8D5"},
  {cat:"생산/제작", cn:"裁切", py:"cái qiē", tone:"2성+1성", mean:"재단하다", ex_cn:"方形裁切得整齐。", ex_py:"fāng xíng cái qiē de zhěng qí", ex_ko:"사각형을 깔끔하게 재단하다.", note:"전문 용어", color:"#F5E8D5"},
  {cat:"생산/제작", cn:"整齐", py:"zhěng qí", tone:"3성+2성", mean:"깔끔하다, 가지런하다", ex_cn:"裁切得整齐一点。", ex_py:"cái qiē de zhěng qí yì diǎn", ex_ko:"좀 더 깔끔하게 재단해 주세요.", note:"", color:"#F5E8D5"},

  {cat:"무역/통관", cn:"发票", py:"fā piào", tone:"1성+4성", mean:"인보이스, 영수증", ex_cn:"发票发给我。", ex_py:"fā piào fā gěi wǒ", ex_ko:"인보이스 보내주세요.", note:"", color:"#FAF1D0"},
  {cat:"무역/통관", cn:"装箱单", py:"zhuāng xiāng dān", tone:"1성+1성+1성", mean:"패킹 리스트", ex_cn:"装箱单也要。", ex_py:"zhuāng xiāng dān yě yào", ex_ko:"패킹 리스트도 필요해요.", note:"", color:"#FAF1D0"},
  {cat:"무역/통관", cn:"提单", py:"tí dān", tone:"2성+1성", mean:"선하증권 (B/L)", ex_cn:"什么时候出提单?", ex_py:"shén me shí hou chū tí dān", ex_ko:"선하증권 언제 나와요?", note:"무역 필수", color:"#FAF1D0"},
  {cat:"무역/통관", cn:"海关", py:"hǎi guān", tone:"3성+1성", mean:"세관", ex_cn:"卡在海关了。", ex_py:"kǎ zài hǎi guān le", ex_ko:"세관에 묶였어요.", note:"", color:"#FAF1D0"},
  {cat:"무역/통관", cn:"放行", py:"fàng xíng", tone:"4성+2성", mean:"통관 허가", ex_cn:"已经放行了。", ex_py:"yǐ jīng fàng xíng le", ex_ko:"이미 통관 허가됐어요.", note:"", color:"#FAF1D0"},
];

const FAV_KEY = 'dang_go_favorites_v2';
const state = {
  search: "", category: "전체",
  favorites: new Set(), mode: "all",
  cards: {
    all: { index: 0, flipped: false, shuffled: [] },
    fav: { index: 0, flipped: false, shuffled: [] },
  },
};

try {
  const saved = localStorage.getItem(FAV_KEY);
  if (saved) state.favorites = new Set(JSON.parse(saved));
} catch (e) {}

function saveFavs() {
  try { localStorage.setItem(FAV_KEY, JSON.stringify([...state.favorites])); } catch (e) {}
}

const categories = ["전체", ...new Set(VOCAB.map(v => v.cat))];

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
}

function shuffleArray(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function getPool(mode) {
  if (mode === 'fav') return VOCAB.filter(v => state.favorites.has(v.cn));
  return VOCAB;
}

function ensureShuffled(mode) {
  const pool = getPool(mode);
  const cs = state.cards[mode];
  if (cs.shuffled.length !== pool.length) {
    cs.shuffled = shuffleArray(pool.map((_, i) => i));
    cs.index = 0;
    cs.flipped = false;
  }
}

function reshuffleMode(mode) {
  const pool = getPool(mode);
  state.cards[mode].shuffled = shuffleArray(pool.map((_, i) => i));
  state.cards[mode].index = 0;
  state.cards[mode].flipped = false;
}

function getFiltered() {
  const s = state.search.toLowerCase().trim();
  return VOCAB.filter(v => {
    if (state.category !== "전체" && v.cat !== state.category) return false;
    if (!s) return true;
    return v.cn.includes(s) || v.py.toLowerCase().includes(s) ||
           v.mean.toLowerCase().includes(s) || v.ex_cn.includes(s) ||
           v.ex_ko.toLowerCase().includes(s);
  });
}

function renderFilters() {
  const el = document.getElementById('filter-chips');
  el.innerHTML = categories.map(c =>
    `<button class="filter-chip ${state.category === c ? 'active' : ''}" data-cat="${escapeHtml(c)}">${escapeHtml(c)}</button>`
  ).join('');
  el.querySelectorAll('.filter-chip').forEach(btn => {
    btn.addEventListener('click', () => {
      state.category = btn.dataset.cat;
      renderFilters();
      renderList();
    });
  });
}

function renderListCard(v) {
  const isFav = state.favorites.has(v.cn);
  return `
    <div class="vocab-card">
      <div class="vocab-card-top">
        <span class="vocab-category">${escapeHtml(v.cat)}</span>
        <button class="fav-btn ${isFav ? 'active' : ''}" data-cn="${escapeHtml(v.cn)}" aria-label="즐겨찾기">${isFav ? '♥' : '♡'}</button>
      </div>
      <h3 class="vocab-meaning">${escapeHtml(v.mean)}</h3>
      <div class="vocab-chinese-row">
        <span class="vocab-chinese">${escapeHtml(v.cn)}</span>
        <span class="vocab-pinyin">${escapeHtml(v.py)}</span>
      </div>
      <div class="vocab-tone">${escapeHtml(v.tone)}</div>
      <div class="vocab-example">
        <div class="vocab-example-ko">${escapeHtml(v.ex_ko)}</div>
        <div class="vocab-example-cn">${escapeHtml(v.ex_cn)}</div>
      </div>
      ${v.note ? `<p class="vocab-note">💡 ${escapeHtml(v.note)}</p>` : ''}
    </div>
  `;
}

function renderList() {
  const list = getFiltered();
  const el = document.getElementById('vocab-list');
  document.getElementById('stats-row').textContent = `총 ${list.length}개`;
  if (list.length === 0) {
    el.innerHTML = '<div class="empty-state"><div class="empty-state-emoji">🔍</div>검색 결과가 없어요</div>';
    return;
  }
  el.innerHTML = list.map(renderListCard).join('');
  el.querySelectorAll('.fav-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const cn = btn.dataset.cn;
      if (state.favorites.has(cn)) state.favorites.delete(cn);
      else state.favorites.add(cn);
      saveFavs();
      renderList();
      state.cards.fav.shuffled = [];
      renderFlashcard('all');
      renderFlashcard('fav');
    });
  });
}

function renderFlashcard(mode) {
  const pool = getPool(mode);
  const cs = state.cards[mode];

  if (mode === 'fav' && pool.length === 0) {
    document.getElementById('quiz-progress-fav').textContent = '0 / 0';
    const card = document.getElementById('flashcard-fav');
    card.style.background = 'var(--surface-2)';
    document.getElementById('card-category-fav').textContent = '';
    document.getElementById('card-ex-ko-fav').innerHTML = '<div style="font-size:14px; color: var(--text-3); padding: 40px 0; line-height:1.7;">즐겨찾기한 단어가 없어요<br><span style="font-size:12px;">하트 버튼을 눌러서 추가해보세요</span></div>';
    document.getElementById('card-ex-cn-fav').textContent = '';
    document.getElementById('card-ex-pinyin-fav').textContent = '';
    document.getElementById('card-meaning-front-fav').textContent = '';
    document.getElementById('card-meaning-front-fav').style.display = 'none';
    document.getElementById('card-hint-fav').textContent = '';
    card.classList.remove('flipped');
    document.getElementById('card-fav-fav').classList.remove('active');
    document.getElementById('card-fav-fav').textContent = '♡';
    return;
  }

  ensureShuffled(mode);
  if (cs.index >= pool.length) cs.index = 0;
  const idx = cs.shuffled[cs.index];
  const v = pool[idx];
  if (!v) return;

  document.getElementById(`quiz-progress-${mode}`).textContent = `${cs.index + 1} / ${pool.length}`;
  const card = document.getElementById(`flashcard-${mode}`);
  card.style.background = v.color;

  document.getElementById(`card-category-${mode}`).textContent = v.cat;
  document.getElementById(`card-ex-ko-${mode}`).textContent = v.ex_ko;
  document.getElementById(`card-ex-cn-${mode}`).textContent = v.ex_cn;
  document.getElementById(`card-ex-pinyin-${mode}`).textContent = v.ex_py;
  document.getElementById(`card-meaning-front-${mode}`).textContent = v.mean;
  document.getElementById(`card-meaning-front-${mode}`).style.display = '';
  document.getElementById(`card-chinese-${mode}`).textContent = v.cn;
  document.getElementById(`card-meaning-back-${mode}`).textContent = v.mean;
  document.getElementById(`card-pinyin-${mode}`).textContent = v.py;
  const noteEl = document.getElementById(`card-note-${mode}`);
  noteEl.textContent = v.note ? '💡 ' + v.note : '';
  noteEl.style.display = v.note ? 'block' : 'none';

  const hintEl = document.getElementById(`card-hint-${mode}`);
  hintEl.textContent = cs.flipped ? '탭해서 다음 단어로 →' : '탭해서 정답 보기';

  const favBtn = document.getElementById(`card-fav-${mode}`);
  if (state.favorites.has(v.cn)) {
    favBtn.textContent = '♥';
    favBtn.classList.add('active');
  } else {
    favBtn.textContent = '♡';
    favBtn.classList.remove('active');
  }

  if (cs.flipped) card.classList.add('flipped');
  else card.classList.remove('flipped');
}

function handleCardClick(e, mode) {
  if (e && e.target.closest('.fav-center-btn')) return;
  const cs = state.cards[mode];
  if (!cs.flipped) {
    cs.flipped = true;
    renderFlashcard(mode);
  } else {
    nextCard(mode);
  }
}

function nextCard(mode) {
  const pool = getPool(mode);
  if (pool.length === 0) return;
  const cs = state.cards[mode];
  cs.index = (cs.index + 1) % pool.length;
  cs.flipped = false;
  renderFlashcard(mode);
}

function prevCard(mode) {
  const pool = getPool(mode);
  if (pool.length === 0) return;
  const cs = state.cards[mode];
  cs.index = (cs.index - 1 + pool.length) % pool.length;
  cs.flipped = false;
  renderFlashcard(mode);
}

function toggleCardFav(e, mode) {
  e.stopPropagation();
  const pool = getPool(mode);
  if (pool.length === 0) return;
  const cs = state.cards[mode];
  const idx = cs.shuffled[cs.index];
  const v = pool[idx];
  if (!v) return;

  if (state.favorites.has(v.cn)) state.favorites.delete(v.cn);
  else state.favorites.add(v.cn);
  saveFavs();
  state.cards.fav.shuffled = [];
  renderFlashcard('all');
  renderFlashcard('fav');
  renderList();
}

window.handleCardClick = handleCardClick;
window.nextCard = nextCard;
window.prevCard = prevCard;
window.toggleCardFav = toggleCardFav;

document.querySelectorAll('.mode-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const mode = btn.dataset.mode;
    state.mode = mode;
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.toggle('active', b === btn));
    document.getElementById('tab-all').classList.toggle('active', mode === 'all');
    document.getElementById('tab-fav').classList.toggle('active', mode === 'fav');
    document.getElementById('tab-list').classList.toggle('active', mode === 'list');

    if (mode === 'all' || mode === 'fav') {
      reshuffleMode(mode);
      renderFlashcard(mode);
    }
    if (mode === 'list') renderList();
    window.scrollTo(0, 0);
  });
});

document.getElementById('search-input').addEventListener('input', (e) => {
  state.search = e.target.value;
  renderList();
});

reshuffleMode('all');
renderFlashcard('all');
renderFlashcard('fav');
renderFilters();
renderList();
</script>
</body>
</html>
