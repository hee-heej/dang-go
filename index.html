<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
<meta name="theme-color" content="#F5F1EB">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Dang-go">
<title>Dang-go</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍡</text></svg>">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍡</text></svg>">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
  :root{
    --bg:#F5F1EB;--surface:#FFFCF7;--surface-2:#EFEBE3;
    --text:#3A3531;--text-2:#6B655F;--text-3:#9C968E;
    --border:rgba(0,0,0,0.05);--border-2:rgba(0,0,0,0.10);
    --accent:#C97B8E;--shadow:0 2px 6px rgba(0,0,0,0.04);
    --radius:16px;--radius-sm:10px;
    --eval-again:#E8806E;--eval-later:#E8B86E;--eval-good:#8FB87A;--eval-perfect:#7AA8C8;
  }
  @media(prefers-color-scheme:dark){
    :root{--bg:#1F1D1B;--surface:#2A2826;--surface-2:#353230;--text:#E8E2D8;--text-2:#B0A99F;--text-3:#847E76;--border:rgba(255,255,255,0.06);--border-2:rgba(255,255,255,0.12);--accent:#E2A2B2;--shadow:0 2px 8px rgba(0,0,0,0.25)}
  }
  html,body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Pretendard","Apple SD Gothic Neo",sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
  body{max-width:480px;margin:0 auto;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);min-height:100vh}
  .app{padding:16px 16px 24px}
  .header{display:flex;align-items:center;justify-content:center;gap:8px;padding:8px 4px 16px}
  .header-emoji{font-size:24px}
  .header h1{font-size:22px;font-weight:700;letter-spacing:-0.5px;color:var(--text)}
  .mode-toggle{display:flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:999px;margin-bottom:16px}
  .mode-btn{flex:1;background:transparent;border:none;padding:8px 6px;font-size:12px;font-weight:500;color:var(--text-2);cursor:pointer;border-radius:999px;font-family:inherit;transition:all 0.15s}
  .mode-btn.active{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,0.06);font-weight:600}
  .tab-content{display:none}.tab-content.active{display:block}
  .flash-page{display:flex;flex-direction:column}
  .quiz-progress{display:flex;justify-content:center;align-items:center;gap:12px;font-size:12px;color:var(--text-3);margin-bottom:12px;font-weight:500;letter-spacing:0.5px}
  .quiz-progress .round-badge{background:var(--surface-2);padding:3px 10px;border-radius:999px;font-size:11px;color:var(--text-2)}
  .card-container{position:relative;margin-bottom:16px}
  .card-nav{position:absolute;top:50%;transform:translateY(-50%);width:36px;height:36px;background:rgba(255,255,255,0.7);border:1px solid var(--border);border-radius:50%;cursor:pointer;font-size:16px;color:var(--text-2);display:flex;align-items:center;justify-content:center;z-index:10;transition:all 0.15s;font-family:inherit}
  @media(prefers-color-scheme:dark){.card-nav{background:rgba(58,53,49,0.7);color:var(--text)}}
  .card-nav:active{transform:translateY(-50%) scale(0.9)}
  .card-nav.prev{left:8px}.card-nav.next{right:8px}
  .flashcard{background:#E8E2F0;border-radius:24px;padding:22px 22px 24px;cursor:pointer;user-select:none;-webkit-user-select:none;box-shadow:var(--shadow);overflow:hidden;transition:transform 0.1s,opacity 0.15s;position:relative;display:flex;flex-direction:column;min-height:440px}
  .flashcard:active{transform:scale(0.99)}
  .flash-top{display:flex;justify-content:center;align-items:center;margin-bottom:16px}
  .flash-category{font-size:13px;font-weight:500;color:rgba(58,53,49,0.7);background:rgba(255,255,255,0.45);padding:4px 12px;border-radius:999px}
  .flash-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:8px 0}
  .flash-example-area{width:100%;margin-bottom:20px}
  .flash-example-ko{font-size:24px;font-weight:600;color:rgba(58,53,49,0.95);line-height:1.4;letter-spacing:-0.5px;margin-bottom:12px}
  .flash-example-cn{font-size:22px;font-weight:600;color:rgba(58,53,49,0.92);line-height:1.4;letter-spacing:-0.5px;margin-bottom:8px;display:none}
  .flashcard.flipped .flash-example-cn{display:block}
  .flash-example-pinyin{font-size:13px;color:rgba(58,53,49,0.55);font-style:italic;display:none}
  .flashcard.flipped .flash-example-pinyin{display:block}
  .flash-front-meaning{display:inline-block;background:rgba(58,53,49,0.10);color:rgba(58,53,49,0.78);padding:7px 16px;border-radius:999px;font-size:13px;font-weight:500}
  .flashcard.flipped .flash-front-meaning{display:none}
  .flash-back-info{display:none;width:100%;padding-top:18px;border-top:1px solid rgba(58,53,49,0.12)}
  .flashcard.flipped .flash-back-info{display:block}
  .flash-back-chinese{font-size:22px;font-weight:600;color:rgba(58,53,49,0.95);line-height:1.2;letter-spacing:-0.3px;margin-bottom:6px}
  .flash-back-meaning{font-size:13px;color:rgba(58,53,49,0.75);margin-bottom:4px}
  .flash-back-pinyin{font-size:13px;color:rgba(58,53,49,0.55);font-style:italic}
  .flash-note{font-size:12px;color:rgba(58,53,49,0.55);font-style:italic;padding:8px 8px 0;margin-top:4px}
  .hanzi-breakdown{width:100%;margin-top:16px;padding-top:14px;border-top:1px dashed rgba(58,53,49,0.15);display:flex;flex-direction:column;gap:8px}
  .hanzi-item{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,0.45);padding:8px 10px;border-radius:8px;text-align:left}
  @media(prefers-color-scheme:dark){.hanzi-item{background:rgba(255,255,255,0.05)}}
  .hanzi-char{font-size:22px;font-weight:600;color:rgba(58,53,49,0.92);min-width:28px;text-align:center}
  .hanzi-info{flex:1;display:flex;flex-direction:column;gap:1px;min-width:0}
  .hanzi-line-1{font-size:12px;color:rgba(58,53,49,0.78);display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
  .hanzi-pinyin{color:rgba(58,53,49,0.58);font-style:italic}
  .hanzi-line-2{font-size:11px;color:rgba(58,53,49,0.55);display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
  .hanzi-trad{background:rgba(58,53,49,0.08);padding:1px 5px;border-radius:4px;font-weight:500;color:rgba(58,53,49,0.7)}
  .hanzi-korean{color:rgba(58,53,49,0.6)}
  .quiz-controls.eval-controls{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .eval-btn{background:var(--surface);border:1px solid var(--border);padding:12px 8px;border-radius:var(--radius-sm);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;transition:all 0.1s;display:flex;flex-direction:column;align-items:center;gap:2px}
  .eval-btn:active{transform:scale(0.95)}
  .eval-btn .eval-dot{width:8px;height:8px;border-radius:50%;margin-bottom:4px}
  .eval-btn[data-rating="again"]{color:var(--eval-again);border-color:rgba(232,128,110,0.3)}.eval-btn[data-rating="again"] .eval-dot{background:var(--eval-again)}.eval-btn[data-rating="again"]:active{background:rgba(232,128,110,0.1)}
  .eval-btn[data-rating="later"]{color:#C8954E;border-color:rgba(232,184,110,0.3)}.eval-btn[data-rating="later"] .eval-dot{background:var(--eval-later)}.eval-btn[data-rating="later"]:active{background:rgba(232,184,110,0.1)}
  .eval-btn[data-rating="good"]{color:#6B9355;border-color:rgba(143,184,122,0.3)}.eval-btn[data-rating="good"] .eval-dot{background:var(--eval-good)}.eval-btn[data-rating="good"]:active{background:rgba(143,184,122,0.1)}
  .eval-btn[data-rating="perfect"]{color:#5689A6;border-color:rgba(122,168,200,0.3)}.eval-btn[data-rating="perfect"] .eval-dot{background:var(--eval-perfect)}.eval-btn[data-rating="perfect"]:active{background:rgba(122,168,200,0.1)}
  @media(prefers-color-scheme:dark){.eval-btn[data-rating="later"]{color:#E8B86E}.eval-btn[data-rating="good"]{color:#A8C893}.eval-btn[data-rating="perfect"]{color:#95B8D0}}
  .search-input{width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);color:var(--text);font-size:14px;font-family:inherit;margin-bottom:12px;-webkit-appearance:none;text-align:center}
  .search-input:focus{outline:none;border-color:var(--border-2)}
  .filter-row{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
  .filter-row::-webkit-scrollbar{display:none}
  .filter-chip{background:var(--surface);border:1px solid var(--border);padding:6px 12px;border-radius:999px;font-size:12px;cursor:pointer;color:var(--text-2);white-space:nowrap;font-family:inherit;flex-shrink:0;font-weight:500}
  .filter-chip.active{background:var(--text);color:var(--surface);border-color:var(--text)}
  .stats-row{font-size:11px;color:var(--text-3);margin-bottom:12px;text-align:center;font-weight:500;letter-spacing:0.3px}
  .vocab-list{display:flex;flex-direction:column;gap:10px}
  .vocab-card{background:var(--surface);border-radius:var(--radius);padding:16px 14px 14px;position:relative;box-shadow:var(--shadow);border:1px solid var(--border);text-align:center}
  .vocab-card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;gap:10px}
  .vocab-category{display:inline-block;font-size:10px;padding:3px 8px;border-radius:999px;background:var(--surface-2);color:var(--text-2);font-weight:500;letter-spacing:0.3px}
  .vocab-rating-badge{font-size:10px;padding:2px 8px;border-radius:999px;font-weight:600}
  .vocab-rating-badge.again{background:rgba(232,128,110,0.15);color:var(--eval-again)}
  .vocab-rating-badge.later{background:rgba(232,184,110,0.15);color:#C8954E}
  .vocab-rating-badge.good{background:rgba(143,184,122,0.15);color:#6B9355}
  .vocab-rating-badge.perfect{background:rgba(122,168,200,0.15);color:#5689A6}
  .vocab-meaning{font-size:17px;font-weight:600;color:var(--text);margin-bottom:8px;line-height:1.3;letter-spacing:-0.3px}
  .vocab-chinese-row{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:3px;justify-content:center}
  .vocab-chinese{font-size:18px;font-weight:500;color:var(--text)}
  .vocab-pinyin{font-size:13px;color:var(--text-2);font-style:italic}
  .vocab-tone{font-size:10px;color:var(--text-3);margin-bottom:10px;letter-spacing:0.3px}
  .vocab-example{background:var(--surface-2);padding:10px 12px;border-radius:var(--radius-sm);font-size:13px}
  .vocab-example-ko{color:var(--text);margin-bottom:3px;font-weight:500}
  .vocab-example-cn{color:var(--text-2);font-size:12px}
  .vocab-note{font-size:11px;color:var(--text-3);margin-top:8px;font-style:italic}
  .empty-state{text-align:center;padding:60px 20px;color:var(--text-3);font-size:13px}
  .empty-state-emoji{font-size:36px;margin-bottom:8px;opacity:0.6}
  .filter-rating-row{display:flex;gap:6px;margin-bottom:12px;justify-content:center;flex-wrap:wrap}
  .rating-filter-btn{background:var(--surface);border:1px solid var(--border);padding:6px 12px;border-radius:999px;font-size:11px;cursor:pointer;color:var(--text-2);font-family:inherit;font-weight:500}
  .rating-filter-btn.active{background:var(--text);color:var(--surface);border-color:var(--text)}
</style>
</head>
<body>
<div class="app">
  <div class="header"><span class="header-emoji">🍡</span><h1>Dang-go</h1></div>
  <div class="mode-toggle">
    <button class="mode-btn active" data-mode="all">전체</button>
    <button class="mode-btn" data-mode="review">복습</button>
    <button class="mode-btn" data-mode="list">리스트 보기</button>
  </div>
  <div class="tab-content active" id="tab-all">
    <div class="flash-page">
      <div class="quiz-progress"><span id="quiz-progress-all">1 / 0</span><span class="round-badge" id="round-badge-all">1회차</span></div>
      <div class="card-container">
        <button class="card-nav prev" onclick="prevCard('all')" aria-label="이전">‹</button>
        <button class="card-nav next" onclick="nextCard('all')" aria-label="다음">›</button>
        <div class="flashcard" id="flashcard-all" onclick="handleCardClick(event,'all')">
          <div class="flash-top"><span class="flash-category" id="card-category-all"></span></div>
          <div class="flash-body">
            <div class="flash-example-area">
              <div class="flash-example-ko" id="card-ex-ko-all"></div>
              <div class="flash-example-cn" id="card-ex-cn-all"></div>
              <div class="flash-example-pinyin" id="card-ex-pinyin-all"></div>
            </div>
            <div class="flash-front-meaning" id="card-meaning-front-all"></div>
            <div class="flash-back-info">
              <div class="flash-back-chinese" id="card-chinese-all"></div>
              <div class="flash-back-meaning" id="card-meaning-back-all"></div>
              <div class="flash-back-pinyin" id="card-pinyin-all"></div>
              <div class="flash-note" id="card-note-all"></div>
              <div class="hanzi-breakdown" id="hanzi-breakdown-all"></div>
            </div>
          </div>
        </div>
      </div>
      <div class="quiz-controls eval-controls">
        <button class="eval-btn" data-rating="again" onclick="rateCard('again','all')"><span class="eval-dot"></span><span>Again</span></button>
        <button class="eval-btn" data-rating="later" onclick="rateCard('later','all')"><span class="eval-dot"></span><span>Later</span></button>
        <button class="eval-btn" data-rating="good" onclick="rateCard('good','all')"><span class="eval-dot"></span><span>Good</span></button>
        <button class="eval-btn" data-rating="perfect" onclick="rateCard('perfect','all')"><span class="eval-dot"></span><span>Perfect</span></button>
      </div>
    </div>
  </div>
  <div class="tab-content" id="tab-review">
    <div class="flash-page">
      <div class="filter-rating-row">
        <button class="rating-filter-btn active" data-filter="weak">Again+Later</button>
        <button class="rating-filter-btn" data-filter="again">Again만</button>
        <button class="rating-filter-btn" data-filter="unrated">미평가</button>
      </div>
      <div class="quiz-progress"><span id="quiz-progress-review">0 / 0</span><span class="round-badge" id="round-badge-review">1회차</span></div>
      <div class="card-container">
        <button class="card-nav prev" onclick="prevCard('review')" aria-label="이전">‹</button>
        <button class="card-nav next" onclick="nextCard('review')" aria-label="다음">›</button>
        <div class="flashcard" id="flashcard-review" onclick="handleCardClick(event,'review')">
          <div class="flash-top"><span class="flash-category" id="card-category-review"></span></div>
          <div class="flash-body">
            <div class="flash-example-area">
              <div class="flash-example-ko" id="card-ex-ko-review"></div>
              <div class="flash-example-cn" id="card-ex-cn-review"></div>
              <div class="flash-example-pinyin" id="card-ex-pinyin-review"></div>
            </div>
            <div class="flash-front-meaning" id="card-meaning-front-review"></div>
            <div class="flash-back-info">
              <div class="flash-back-chinese" id="card-chinese-review"></div>
              <div class="flash-back-meaning" id="card-meaning-back-review"></div>
              <div class="flash-back-pinyin" id="card-pinyin-review"></div>
              <div class="flash-note" id="card-note-review"></div>
              <div class="hanzi-breakdown" id="hanzi-breakdown-review"></div>
            </div>
          </div>
        </div>
      </div>
      <div class="quiz-controls eval-controls">
        <button class="eval-btn" data-rating="again" onclick="rateCard('again','review')"><span class="eval-dot"></span><span>Again</span></button>
        <button class="eval-btn" data-rating="later" onclick="rateCard('later','review')"><span class="eval-dot"></span><span>Later</span></button>
        <button class="eval-btn" data-rating="good" onclick="rateCard('good','review')"><span class="eval-dot"></span><span>Good</span></button>
        <button class="eval-btn" data-rating="perfect" onclick="rateCard('perfect','review')"><span class="eval-dot"></span><span>Perfect</span></button>
      </div>
    </div>
  </div>
  <div class="tab-content" id="tab-list">
    <input type="text" id="search-input" class="search-input" placeholder="🔍 한국어 / 중국어 / 병음 검색" />
    <div class="filter-row" id="filter-chips"></div>
    <div class="stats-row" id="stats-row"></div>
    <div class="vocab-list" id="vocab-list"></div>
  </div>
</div>
<script>
const HANZI={
  "设":{trad:"設",py:"shè",ko:"설",mean:"설계할 설"},"计":{trad:"計",py:"jì",ko:"계",mean:"셀 계"},
  "稿":{trad:"稿",py:"gǎo",ko:"고",mean:"원고 고"},"款":{trad:"款",py:"kuǎn",ko:"관",mean:"양식 관"},
  "式":{trad:"式",py:"shì",ko:"식",mean:"법/방식 식"},"这":{trad:"這",py:"zhè",ko:"저",mean:"이 저"},
  "种":{trad:"種",py:"zhǒng",ko:"종",mean:"종류 종"},"类":{trad:"類",py:"lèi",ko:"류",mean:"무리 류"},
  "潘":{trad:"潘",py:"pān",ko:"반",mean:"성씨 반"},"通":{trad:"通",py:"tōng",ko:"통",mean:"통할 통"},
  "色":{trad:"色",py:"sè",ko:"색",mean:"빛 색"},"渐":{trad:"漸",py:"jiàn",ko:"점",mean:"점점 점"},

  "寸":{trad:"寸",py:"cùn",ko:"촌",mean:"마디 촌"},"规":{trad:"規",py:"guī",ko:"규",mean:"법 규"},
  "格":{trad:"格",py:"gé",ko:"격",mean:"격식 격"},"方":{trad:"方",py:"fāng",ko:"방",mean:"모/방향 방"},
  "形":{trad:"形",py:"xíng",ko:"형",mean:"모양 형"},"样":{trad:"樣",py:"yàng",ko:"양",mean:"모양 양"},
  "品":{trad:"品",py:"pǐn",ko:"품",mean:"물건 품"},"打":{trad:"打",py:"dǎ",ko:"타",mean:"칠 타"},
  "费":{trad:"費",py:"fèi",ko:"비",mean:"비용 비"},"裁":{trad:"裁",py:"cái",ko:"재",mean:"마를 재"},
  "切":{trad:"切",py:"qiē",ko:"절",mean:"끊을 절"},"整":{trad:"整",py:"zhěng",ko:"정",mean:"가지런할 정"},
  "齐":{trad:"齊",py:"qí",ko:"제",mean:"가지런할 제"},"印":{trad:"印",py:"yìn",ko:"인",mean:"도장 인"},
  "刷":{trad:"刷",py:"shuā",ko:"쇄",mean:"인쇄할 쇄"},"油":{trad:"油",py:"yóu",ko:"유",mean:"기름 유"},
  "墨":{trad:"墨",py:"mò",ko:"묵",mean:"먹 묵"},"堆":{trad:"堆",py:"duī",ko:"퇴",mean:"쌓을 퇴"},
  "积":{trad:"積",py:"jī",ko:"적",mean:"쌓을 적"},"不":{trad:"不",py:"bù",ko:"불",mean:"아닐 불"},
  "良":{trad:"良",py:"liáng",ko:"량",mean:"좋을 량"},"核":{trad:"核",py:"hé",ko:"핵",mean:"심사할 핵"},
  "算":{trad:"算",py:"suàn",ko:"산",mean:"셈할 산"},"生":{trad:"生",py:"shēng",ko:"생",mean:"날 생"},
  "产":{trad:"產",py:"chǎn",ko:"산",mean:"낳을 산"},"成":{trad:"成",py:"chéng",ko:"성",mean:"이룰 성"},
  "本":{trad:"本",py:"běn",ko:"본",mean:"근본 본"},"节":{trad:"節",py:"jié",ko:"절",mean:"절약할 절"},

  {cat:"배송 추적",cn:"揽收成功",py:"lǎn shōu chéng gōng",tone:"3성+1성+2성+1성",mean:"수령 완료",ex_cn:"目的地物流商揽收成功。",ex_py:"mù dì dì wù liú shāng lǎn shōu chéng gōng",ex_ko:"목적지 물류업체 수령 완료.",note:"",color:"#D5E8F5"},
  {cat:"배송 추적",cn:"跨境",py:"kuà jìng",tone:"4성+4성",mean:"국제배송, 크로스보더",ex_cn:"【跨境】船舶离港。",ex_py:"kuà jìng chuán bó lí gǎng",ex_ko:"【국제배송】선박 출항.",note:"",color:"#D5E8F5"},
  {cat:"배송 추적",cn:"离港",py:"lí gǎng",tone:"2성+3성",mean:"출항하다",ex_cn:"船舶离港。",ex_py:"chuán bó lí gǎng",ex_ko:"선박이 출항했어요.",note:"↔到港(입항)",color:"#D5E8F5"},

  {cat:"배송 추적",cn:"耐心等待",py:"nài xīn děng dài",tone:"4성+1성+3성+4성",mean:"기다려 주세요",ex_cn:"请您耐心等待。",ex_py:"qǐng nín nài xīn děng dài",ex_ko:"기다려 주세요.",note:"정중한 표현",color:"#D5E8F5"},
  {cat:"배송 추적",cn:"分拨站点",py:"fēn bō zhàn diǎn",tone:"1성+1성+4성+3성",mean:"분류 센터",ex_cn:"到达目的地分拨站点。",ex_py:"dào dá mù dì dì fēn bō zhàn diǎn",ex_ko:"목적지 분류 센터에 도착.",note:"",color:"#D5E8F5"},
  {cat:"배송 추적",cn:"预计",py:"yù jì",tone:"4성+4성",mean:"예정이다, 예상하다",ex_cn:"预计2026-05-23到目的港。",ex_py:"yù jì dào mù dì gǎng",ex_ko:"목적지 항구 도착 예정.",note:"",color:"#D5E8F5"},
];

const RATING_WEIGHT={again:4,later:3,good:2,perfect:1,unrated:2.5};
const RATINGS_KEY='dang_go_ratings_v3';
const REVIEW_FILTER_KEY='dang_go_review_filter_v3';
const state={
  search:"",category:"전체",ratings:{},reviewFilter:'weak',mode:"all",
  cards:{all:{index:0,flipped:false,queue:[],round:1},review:{index:0,flipped:false,queue:[],round:1}},
};
try{const s=localStorage.getItem(RATINGS_KEY);if(s)state.ratings=JSON.parse(s);const sf=localStorage.getItem(REVIEW_FILTER_KEY);if(sf)state.reviewFilter=sf;}catch(e){}
function saveRatings(){try{localStorage.setItem(RATINGS_KEY,JSON.stringify(state.ratings));}catch(e){}}
const categories=["전체",...new Set(VOCAB.map(v=>v.cat))];
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);}
function weightedShuffle(items){
  const wk=items.map(item=>{const rating=state.ratings[item.cn]||'unrated';const weight=RATING_WEIGHT[rating];const r=Math.random();const key=-Math.log(r===0?0.0001:r)/weight;return{item,key};});
  wk.sort((a,b)=>a.key-b.key);return wk.map(x=>x.item);
}
function getPool(mode){
  if(mode==='review'){
    if(state.reviewFilter==='again')return VOCAB.filter(v=>state.ratings[v.cn]==='again');
    if(state.reviewFilter==='unrated')return VOCAB.filter(v=>!state.ratings[v.cn]);
    return VOCAB.filter(v=>state.ratings[v.cn]==='again'||state.ratings[v.cn]==='later');
  }
  return VOCAB;
}
function startNewRound(mode){state.cards[mode].queue=weightedShuffle(getPool(mode));state.cards[mode].index=0;state.cards[mode].flipped=false;}
function ensureRound(mode){const pool=getPool(mode);const cs=state.cards[mode];if(cs.queue.length===0||cs.queue.length!==pool.length)startNewRound(mode);}
function getCurrentCard(mode){const cs=state.cards[mode];if(cs.queue.length===0)return null;if(cs.index>=cs.queue.length)cs.index=0;return cs.queue[cs.index];}
function getFiltered(){
  const s=state.search.toLowerCase().trim();
  return VOCAB.filter(v=>{
    if(state.category!=="전체"&&v.cat!==state.category)return false;
    if(!s)return true;
    return v.cn.includes(s)||v.py.toLowerCase().includes(s)||v.mean.toLowerCase().includes(s)||v.ex_cn.includes(s)||v.ex_ko.toLowerCase().includes(s);
  });
}
function renderFilters(){
  const el=document.getElementById('filter-chips');
  el.innerHTML=categories.map(c=>`<button class="filter-chip ${state.category===c?'active':''}" data-cat="${escapeHtml(c)}">${escapeHtml(c)}</button>`).join('');
  el.querySelectorAll('.filter-chip').forEach(btn=>{btn.addEventListener('click',()=>{state.category=btn.dataset.cat;renderFilters();renderList();});});
}
function renderListCard(v){
  const rating=state.ratings[v.cn];
  const rl=rating?`<span class="vocab-rating-badge ${rating}">${rating.charAt(0).toUpperCase()+rating.slice(1)}</span>`:'';
  return `<div class="vocab-card"><div class="vocab-card-top"><span class="vocab-category">${escapeHtml(v.cat)}</span>${rl}</div><h3 class="vocab-meaning">${escapeHtml(v.mean)}</h3><div class="vocab-chinese-row"><span class="vocab-chinese">${escapeHtml(v.cn)}</span><span class="vocab-pinyin">${escapeHtml(v.py)}</span></div><div class="vocab-tone">${escapeHtml(v.tone)}</div><div class="vocab-example"><div class="vocab-example-ko">${escapeHtml(v.ex_ko)}</div><div class="vocab-example-cn">${escapeHtml(v.ex_cn)}</div></div>${v.note?`<p class="vocab-note">💡 ${escapeHtml(v.note)}</p>`:''}</div>`;
}
function renderList(){
  const list=getFiltered();const el=document.getElementById('vocab-list');
  document.getElementById('stats-row').textContent=`총 ${list.length}개`;
  if(list.length===0){el.innerHTML='<div class="empty-state"><div class="empty-state-emoji">🔍</div>검색 결과가 없어요</div>';return;}
  el.innerHTML=list.map(renderListCard).join('');
}
function renderHanziBreakdown(cn){
  if(!/[\u4e00-\u9fff]/.test(cn))return'';
  let html='';
  for(const ch of Array.from(cn)){
    if(!/[\u4e00-\u9fff]/.test(ch))continue;
    const info=HANZI[ch];
    if(info){html+=`<div class="hanzi-item"><div class="hanzi-char">${escapeHtml(ch)}</div><div class="hanzi-info"><div class="hanzi-line-1"><span>${escapeHtml(info.mean)}</span><span class="hanzi-pinyin">${escapeHtml(info.py)}</span></div><div class="hanzi-line-2"><span class="hanzi-trad">繁 ${escapeHtml(info.trad)}</span><span class="hanzi-korean">韓 ${escapeHtml(info.ko)}</span></div></div></div>`;}
    else{html+=`<div class="hanzi-item"><div class="hanzi-char">${escapeHtml(ch)}</div><div class="hanzi-info"><div class="hanzi-line-1"><span style="color:rgba(58,53,49,0.4)">정보 없음</span></div></div></div>`;}
  }
  return html;
}
function renderFlashcard(mode){
  const pool=getPool(mode);const cs=state.cards[mode];
  if(pool.length===0){
    document.getElementById(`quiz-progress-${mode}`).textContent='0 / 0';
    const card=document.getElementById(`flashcard-${mode}`);card.style.background='var(--surface-2)';
    document.getElementById(`card-category-${mode}`).textContent='';
    document.getElementById(`card-ex-ko-${mode}`).innerHTML='<div style="font-size:14px;color:var(--text-3);padding:40px 0;line-height:1.7">해당하는 단어가 없어요<br><span style="font-size:12px">전체 모드에서 평가를 먼저 해보세요</span></div>';
    ['card-ex-cn-','card-ex-pinyin-','card-meaning-front-'].forEach(id=>{const el=document.getElementById(id+mode);if(el){el.textContent='';el.style.display='none';}});
    document.getElementById(`hanzi-breakdown-${mode}`).innerHTML='';card.classList.remove('flipped');return;
  }
  ensureRound(mode);const v=getCurrentCard(mode);if(!v)return;
  document.getElementById(`quiz-progress-${mode}`).textContent=`${cs.index+1} / ${cs.queue.length}`;
  document.getElementById(`round-badge-${mode}`).textContent=`${cs.round}회차`;
  const card=document.getElementById(`flashcard-${mode}`);card.style.background=v.color;
  document.getElementById(`card-category-${mode}`).textContent=v.cat;
  document.getElementById(`card-ex-ko-${mode}`).textContent=v.ex_ko;
  document.getElementById(`card-ex-cn-${mode}`).textContent=v.ex_cn;
  document.getElementById(`card-ex-pinyin-${mode}`).textContent=v.ex_py;
  const mf=document.getElementById(`card-meaning-front-${mode}`);mf.textContent=v.mean;mf.style.display='';
  document.getElementById(`card-chinese-${mode}`).textContent=v.cn;
  document.getElementById(`card-meaning-back-${mode}`).textContent=v.mean;
  document.getElementById(`card-pinyin-${mode}`).textContent=v.py;
  const noteEl=document.getElementById(`card-note-${mode}`);noteEl.textContent=v.note?'💡 '+v.note:'';noteEl.style.display=v.note?'block':'none';
  document.getElementById(`hanzi-breakdown-${mode}`).innerHTML=renderHanziBreakdown(v.cn);
  if(cs.flipped)card.classList.add('flipped');else card.classList.remove('flipped');
}
function handleCardClick(e,mode){
  if(e&&(e.target.closest('.eval-btn')||e.target.closest('.card-nav')))return;
  const cs=state.cards[mode];
  if(!cs.flipped){cs.flipped=true;renderFlashcard(mode);}else{nextCard(mode);}
}
function nextCard(mode){
  const cs=state.cards[mode];if(cs.queue.length===0)return;
  cs.index++;if(cs.index>=cs.queue.length){cs.round++;startNewRound(mode);}
  cs.flipped=false;renderFlashcard(mode);
}
function prevCard(mode){
  const cs=state.cards[mode];if(cs.queue.length===0)return;
  cs.index=(cs.index-1+cs.queue.length)%cs.queue.length;cs.flipped=false;renderFlashcard(mode);
}
function rateCard(rating,mode){
  const v=getCurrentCard(mode);if(!v)return;
  state.ratings[v.cn]=rating;saveRatings();nextCard(mode);renderList();
}
window.handleCardClick=handleCardClick;window.nextCard=nextCard;window.prevCard=prevCard;window.rateCard=rateCard;
document.querySelectorAll('.mode-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    const mode=btn.dataset.mode;state.mode=mode;
    document.querySelectorAll('.mode-btn').forEach(b=>b.classList.toggle('active',b===btn));
    document.getElementById('tab-all').classList.toggle('active',mode==='all');
    document.getElementById('tab-review').classList.toggle('active',mode==='review');
    document.getElementById('tab-list').classList.toggle('active',mode==='list');
    if(mode==='all'){startNewRound('all');renderFlashcard('all');}
    if(mode==='review'){startNewRound('review');renderFlashcard('review');}
    if(mode==='list')renderList();
    window.scrollTo(0,0);
  });
});
document.querySelectorAll('.rating-filter-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    state.reviewFilter=btn.dataset.filter;
    try{localStorage.setItem(REVIEW_FILTER_KEY,state.reviewFilter);}catch(e){}
    document.querySelectorAll('.rating-filter-btn').forEach(b=>b.classList.toggle('active',b===btn));
    startNewRound('review');renderFlashcard('review');
  });
});
document.getElementById('search-input').addEventListener('input',e=>{state.search=e.target.value;renderList();});
document.querySelectorAll('.rating-filter-btn').forEach(btn=>{btn.classList.toggle('active',btn.dataset.filter===state.reviewFilter);});
startNewRound('all');startNewRound('review');renderFlashcard('all');renderFlashcard('review');renderFilters();renderList();
</script>
</body>
